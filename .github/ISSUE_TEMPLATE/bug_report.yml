name: Bug report
description: Report a reproducible problem without private records or credentials.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Remove identifiers, sessions, recovery codes and keys. Use SECURITY.md for sensitive vulnerabilities.'
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Application version, OS, Python or portable build, and browser.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic examples, never a real database.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
