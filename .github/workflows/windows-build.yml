name: Manual Windows portable build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/run_checks.py
      - run: python scripts/release_check.py
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: StudyForge-Windows-unsigned
          path: dist/StudyForge/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
